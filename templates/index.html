<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }
    h1 { color: #111; }
    ul { list-style: none; padding: 0; }
    li {
      padding: 12px 16px;
      margin-bottom: 8px;
      background: #f4f4f5;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price { font-weight: bold; color: #059669; }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #e4e4e7;
    }
  </style>
</head>
<body>
  <h1>{{ title }}</h1>
  <p>Available items in the catalog:</p>
  <ul>
    {% for item in items %}
      <li>
        <div>
          <strong>{{ item.name }}</strong>
          <span class="badge">{{ item.category }}</span>
        </div>
        <span class="price">${{ "%.2f"|format(item.price) }}</span>
      </li>
    {% endfor %}
  </ul>
</body>
</html>
